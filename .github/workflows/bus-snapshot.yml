name: Bus 117 snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "54 8 * * *"
    - cron: "57 8 * * *"
  push:
    paths:
      - ".github/workflows/bus-snapshot.yml"
      - "snapshot-trigger.txt"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch live bus data
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://bus117-api.vercel.app/api/bus117"             -o latest.tmp.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("latest.tmp.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          if not data.get("ok"):
              raise SystemExit("bus API returned ok=false")

          # Save even when initialization is incomplete so ChatGPT can
          # explicitly report '실시간 정보 초기화 중'.
          Path("latest.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit snapshot
        run: |
          git config user.name "bus117-bot"
          git config user.email "bus117-bot@users.noreply.github.com"
          git add latest.json

          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi

          git commit -m "Update live bus snapshot"
          git push

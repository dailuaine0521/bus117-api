name: Bus 117 snapshot

on:
  workflow_dispatch:
  schedule:
    # 17:35 KST. Once started, refresh every minute until about 18:05.
    - cron: "35 8 * * *"
  push:
    paths:
      - ".github/workflows/bus-snapshot.yml"
      - "snapshot-trigger.txt"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "bus117-bot"
          git config user.email "bus117-bot@users.noreply.github.com"

      - name: Refresh live snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ]; then
            COUNT=30
          else
            COUNT=1
          fi

          for i in $(seq 1 "$COUNT"); do
            echo "Refresh $i/$COUNT"

            curl --fail --silent --show-error \
              "https://bus117-api.vercel.app/api/bus117" \
              -o latest.tmp.json

            python - <<'PY'
          import json
          from pathlib import Path

          p = Path("latest.tmp.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          if not data.get("ok"):
              raise SystemExit("bus API returned ok=false")

          Path("latest.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

            git add latest.json

            if git diff --cached --quiet; then
              echo "No snapshot changes"
            else
              git commit -m "Update live bus snapshot"
              git pull --rebase origin main
              git push origin main
            fi

            if [ "$i" -lt "$COUNT" ]; then
              sleep 60
            fi
          done
